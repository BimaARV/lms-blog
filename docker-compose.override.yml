# Override untuk development dengan hot reload + Vite dev server
services:
  app:
    build:
      target: base
    volumes:
      - ./:/var/www/html
    command: ["php-fpm"]
    ports:
      - "8000:80"

  # Vite dev server (opsional, untuk HMR saat develop)
  vite:
    image: node:20-alpine
    container_name: lms_vite
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    networks:
      - lmsnet
